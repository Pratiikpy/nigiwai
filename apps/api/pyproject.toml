[project]
name = "nigiwai-api"
version = "0.1.0"
description = "Nigiwai HTTP API: accounts, surveys, the public survey endpoints, and everything built on the Qloo Guard."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "nigiwai-qloo-guard",
  "nigiwai-tribes",
  "nigiwai-fit",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "qrcode>=8.0",
  "reportlab>=4.2",
  "fonttools[woff]>=4.54",
  "python-multipart>=0.0.12",
  "zstandard>=0.23",
  "cryptography>=43",
  "email-validator>=2.2",
  "orjson>=3.10",
  "tzdata>=2024.2",
  "anthropic>=0.75",
  "h3>=4.1",
  "numpy>=2.0",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nigiwai_api"]

[tool.uv.sources]
nigiwai-qloo-guard = { workspace = true }
nigiwai-tribes = { workspace = true }
nigiwai-fit = { workspace = true }
