# Local development services. The application containers are in docker-compose.prod.yml.
name: nigiwai-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: nigiwai
      POSTGRES_PASSWORD: nigiwai-dev-only
      POSTGRES_DB: nigiwai
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nigiwai -d nigiwai"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
