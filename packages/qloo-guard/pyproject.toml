[project]
name = "nigiwai-qloo-guard"
version = "0.1.0"
description = "Typed, rule-checked, budgeted, cached and replayable access to the Qloo Taste AI API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qloo_guard"]

[tool.hatch.build.targets.wheel.force-include]
"src/qloo_guard/data" = "qloo_guard/data"
