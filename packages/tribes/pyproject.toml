[project]
name = "nigiwai-tribes"
version = "0.1.0"
description = "Soft tribes from a venue's guests' picks: matrix, NMF, stability against two nulls, lift-based naming, rhythm and projection."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nigiwai_tribes"]
