[project]
name = "nigiwai-fit"
version = "0.1.0"
description = "The Fit Verdict: a transparent, reproducible 0 to 100 fit of a candidate against a crowd's groups, computed from visible components."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nigiwai_fit"]
