[alembic]
script_location = %(here)s/migrations
path_separator = os
prepend_sys_path = .
# The URL comes from NIGIWAI_DATABASE_URL_SYNC (the migration role), never from this file.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
