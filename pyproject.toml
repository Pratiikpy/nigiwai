[project]
name = "nigiwai"
version = "0.1.0"
description = "Nigiwai: read a room's crowd, soundcheck an act before you book it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "hypothesis>=6.115",
  "ruff>=0.7",
  "mypy>=1.13",
  "httpx>=0.27",
  "respx>=0.21",
  "pypdfium2>=5.14.0",
  "opencv-python-headless>=5.0.0.93",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "E501"]  # asserts are fine in tests; the formatter owns line length (comments may run long)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "S608", "PT018", "RUF059"]
# The f-strings in the owner router interpolate module-level column lists and fragments, never request data.
"apps/api/src/nigiwai_api/routers/owner.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: needs the local Postgres and Redis (just up)",
  "live: calls the real Qloo API and spends quota; never runs in CI",
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["qrcode.*", "reportlab.*"]
ignore_missing_imports = true
